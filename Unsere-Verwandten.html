<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Unsere Verwandten</title>
<style>
  :root{--bg:#fff7ea; --teal:#1f8a8a; --teal2:#d4efec; --coral:#f07b5a; --coral2:#fde3da; --ink:#253238; --sun:#f5b922}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:Verdana,"Segoe UI",sans-serif; font-size:21px; line-height:1.35}
  button{font:inherit; cursor:pointer; touch-action:manipulation; color:var(--ink)}
  .screen{display:none; max-width:760px; margin:0 auto; padding:16px 16px 90px}
  .screen.on{display:block}
  h1{font-size:2rem; text-align:center; margin:14px 0 4px; color:var(--teal)}
  .sub{text-align:center; margin:0 0 18px}
  .menu{display:grid; gap:14px}
  .mbtn{display:flex; align-items:center; gap:16px; background:#fff; border:4px solid var(--teal); border-radius:26px; padding:16px; text-align:left; font-size:1.15rem; font-weight:bold; box-shadow:0 6px 0 var(--teal)}
  .mbtn:active{transform:translateY(4px); box-shadow:0 2px 0 var(--teal)}
  .mbtn .ic{font-size:2.6rem; line-height:1}
  .mbtn .st{margin-left:auto; color:var(--sun); font-size:1.4rem}
  .top{display:flex; align-items:center; gap:10px; margin-bottom:12px}
  .home{background:#fff; border:3px solid var(--teal); border-radius:16px; padding:8px 14px; font-weight:bold}
  .dots{margin-left:auto; display:flex; gap:6px}
  .dots i{width:16px; height:16px; border-radius:50%; background:#e3dccd; display:block}
  .dots i.on{background:var(--sun)}
  .q{background:#fff; border-radius:24px; padding:16px 18px; font-size:1.3rem; font-weight:bold; text-align:center; margin-bottom:16px; border:3px solid var(--teal2); display:flex; align-items:center; gap:10px; justify-content:center}
  .say{border:0; background:var(--teal2); border-radius:50%; width:48px; height:48px; font-size:1.4rem; flex:none}
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px}
  .pick{background:#fff; border:4px solid #e3dccd; border-radius:24px; padding:14px 8px; text-align:center; font-weight:bold; font-size:1.1rem; min-height:170px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; transition:transform .15s}
  .pick .em{font-size:4.2rem; line-height:1}
  .pick img{max-width:100%; height:130px; object-fit:contain; background:#fff; border-radius:12px}
  .pick:active{transform:scale(.96)}
  .pick.ok{border-color:#3aa55b; background:#e4f6e8; animation:pop .5s}
  .pick.no{border-color:var(--coral); background:var(--coral2); animation:shake .4s}
  @keyframes pop{40%{transform:scale(1.08)}}
  @keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
  .fb{min-height:64px; margin-top:16px; text-align:center; font-size:1.2rem; font-weight:bold; border-radius:20px; padding:12px; display:none}
  .fb.on{display:block}
  .fb.good{background:#e4f6e8; color:#1f6b35}
  .fb.bad{background:var(--coral2); color:#9a3a1d}
  .next{display:none; margin:16px auto 0; background:var(--teal); color:#fff; border:0; border-radius:20px; padding:14px 30px; font-size:1.25rem; font-weight:bold; box-shadow:0 5px 0 #146363}
  .tree{background:#fff; border-radius:24px; padding:12px; margin-bottom:16px; border:3px solid var(--teal2)}
  .tree svg{width:100%; display:block}
  .pro{display:inline-block; background:var(--sun); color:#3a2a00; border-radius:12px; padding:2px 10px; font-size:.8rem; margin-right:6px; vertical-align:middle}
  .pick .num{position:absolute; top:8px; left:8px; width:38px; height:38px; border-radius:50%; background:var(--teal); color:#fff; display:grid; place-items:center; font-size:1.2rem}
  .pick{position:relative}
  .done{text-align:center; padding-top:30px}
  .done .big{font-size:5rem}
  .done .stars{font-size:3rem; color:var(--sun); letter-spacing:8px}
  #help,#cred{position:fixed; bottom:14px; z-index:20; border:3px solid var(--teal); background:#fff; border-radius:30px; font-weight:bold}
  #help{right:14px; width:56px; height:56px; font-size:1.6rem}
  #cred{left:14px; padding:6px 12px; font-size:.8rem}
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; place-items:center; padding:16px; z-index:30}
  .modal.on{display:grid}
  .box{background:#fff; border-radius:24px; padding:20px; max-width:480px; font-size:1rem}
  .box ul{padding-left:20px} .box li{margin-bottom:8px}
  i.lat{font-style:italic}
</style>
</head>
<body>
<section class="screen on" id="home">
  <h1>Unsere Verwandten</h1>
  <p class="sub">Tippe auf ein Spiel!</p>
  <div class="menu">
    <button class="mbtn" data-game="0"><span class="ic">🦍</span>Wer ist mit uns verwandt?<span class="st" id="s0"></span></button>
    <button class="mbtn" data-game="1"><span class="ic">🌳</span>Mein erster Stammbaum<span class="st" id="s1"></span></button>
    <button class="mbtn" data-game="2"><span class="ic">⏳</span>Was ist älter?<span class="st" id="s2"></span></button>
    <button class="mbtn" data-game="3"><span class="ic">🦴</span>Knochen-Detektiv<span class="st" id="s3"></span></button>
  </div>
</section>
<section class="screen" id="play">
  <div class="top"><button class="home" id="toHome">🏠 Zurück</button><div class="dots" id="dots"></div></div>
  <div class="q"><span id="qtext"></span><button class="say" id="say" aria-label="Vorlesen">🔊</button></div>
  <div id="area"></div>
  <div class="fb" id="fb"></div>
  <button class="next" id="next">Weiter ➜</button>
</section>
<section class="screen" id="end">
  <div class="done"><div class="big">🎉</div><h1>Super gemacht!</h1><div class="stars">★★★</div>
  <p id="endtxt"></p><button class="next" style="display:inline-block" id="endHome">🏠 Zu den Spielen</button></div>
</section>
<button id="help" aria-label="Hilfe">?</button>
<button id="cred">📷 Bilder</button>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>

let G, R, locked;
function start(g){ G=g; R=0; show("play"); load(); }
function load(){
  const game=GAMES[G], r=game.rounds[R]; locked=false;
  $("#dots").innerHTML=game.rounds.map((_,i)=>`<i class="${i<R?"on":""}"></i>`).join("");
  $("#qtext").innerHTML=(r.pro?'<span class="pro">💪 Profi</span>':"")+r.q; r.got=[]; $("#fb").className="fb"; $("#next").style.display="none";
  let html="";
  if(game.tree){
    html+=`<div class="tree">${treeSvg(r.tips,null,r.miss)}</div>`;
  }
  html+=`<div class="cards">${r.c.map(card).join("")}</div>`;
  $("#area").innerHTML=html;
  if(r.sizes) document.querySelectorAll(".pick").forEach(b=>{ const s=r.sizes[b.dataset.k]; if(s) b.querySelector("img").style.height=(130*s)+"px"; });
  document.querySelectorAll(".pick").forEach(b=>b.onclick=()=>choose(b));
}
function treeSvg(tips, filled, miss){
  const n=tips.length+1; if(miss===undefined) miss=n-1;
  const all=tips.slice(); all.splice(miss,0, filled||["❓",""]);
  const W=120*n, xs=all.map((_,i)=>60+i*120), top=74, base=132, step=42;
  const H=base+step*(n-1)+70;
  const bark="#8a5a32", bark2="#6e4424";
  // Knoten wie bei einer Leiter: zuerst die zwei rechten, dann nach links unten
  const tipsP=xs.map(x=>({x,y:base}));
  let nodes=[]; let cur={x:(xs[n-2]+xs[n-1])/2, y:base+step, kids:[tipsP[n-2],tipsP[n-1]]}; nodes.push(cur);
  for(let i=n-3;i>=0;i--){ const nd={x:(xs[i]+cur.x)/2, y:cur.y+step, kids:[tipsP[i],cur]}; nodes.push(nd); cur=nd; }
  const root=cur, groundY=H-22;
  const branch=(p,c,w)=>`<path d="M${p.x},${p.y} C${p.x},${p.y-(p.y-c.y)*.55} ${c.x},${c.y+(p.y-c.y)*.45} ${c.x},${c.y}" fill="none" stroke="${bark}" stroke-width="${w}" stroke-linecap="round"/>`;
  let s=`<svg viewBox="0 0 ${W} ${H}">`;
  // Blätterkronen hinter den Tieren
  xs.forEach(x=>{ s+=`<ellipse cx="${x}" cy="${top-2}" rx="56" ry="50" fill="#d6ecc8"/><ellipse cx="${x-22}" cy="${top+18}" rx="30" ry="24" fill="#c8e4b6"/><ellipse cx="${x+24}" cy="${top+14}" rx="28" ry="22" fill="#c8e4b6"/>`; });
  // Wiese
  s+=`<ellipse cx="${W/2}" cy="${groundY+10}" rx="${W/2-8}" ry="16" fill="#a9d18e"/>`;
  // Stamm (unten breit)
  s+=`<path d="M${root.x-20},${groundY+4} C${root.x-12},${groundY-14} ${root.x-9},${root.y+12} ${root.x-8},${root.y} L${root.x+8},${root.y} C${root.x+9},${root.y+12} ${root.x+12},${groundY-14} ${root.x+20},${groundY+4} Z" fill="${bark}"/>`;
  // Äste: je weiter oben, desto dünner
  const depthW = d=> Math.max(7, 16 - d*3);
  nodes.slice().reverse().forEach((nd,d)=>{ nd.kids.forEach(k=>{ s+=branch(nd,k, k.kids? depthW(d+1)+2 : 7); }); s+=`<circle cx="${nd.x}" cy="${nd.y}" r="${depthW(d)/2+1}" fill="${bark2}"/>`; });
  // Tiere
  all.forEach((t,i)=>{ s+=`<text x="${xs[i]}" y="${top+12}" text-anchor="middle" font-size="58">${t[0]}</text><text x="${xs[i]}" y="${top+44}" text-anchor="middle" font-size="18" font-weight="bold" font-family="Verdana" fill="#253238">${t[1]}</text>`; });
  if(!filled) s+=`<rect x="${xs[miss]-52}" y="20" width="104" height="104" rx="20" fill="rgba(255,255,255,.5)" stroke="#f07b5a" stroke-width="4" stroke-dasharray="10 8"/>`;
  return s+"</svg>";
}
function choose(b){
  if(locked) return; const game=GAMES[G], r=game.rounds[R], fb=$("#fb");
  if(r.type==="order"){
    if(r.got.includes(b.dataset.k)) return;
    if(b.dataset.k===r.order[r.got.length]){ document.querySelectorAll(".pick.no").forEach(x=>x.classList.remove("no")); r.got.push(b.dataset.k); b.classList.add("ok"); b.insertAdjacentHTML("beforeend",`<span class="num">${r.got.length}</span>`);
      if(r.got.length===r.order.length){ locked=true; fb.className="fb on good"; fb.innerHTML="⭐ "+r.ok; speak(r.ok); $("#next").style.display="block"; }
      else { fb.className="fb"; } }
    else { r.got=[]; document.querySelectorAll(".pick").forEach(x=>{ x.classList.remove("ok"); const nn=x.querySelector(".num"); if(nn) nn.remove(); });
      b.classList.remove("no"); void b.offsetWidth; b.classList.add("no"); fb.className="fb on bad"; fb.innerHTML=r.no; speak(r.no); }
    return;
  }
  if(b.dataset.k===r.a){ locked=true; b.classList.add("ok"); fb.className="fb on good"; fb.innerHTML="⭐ "+r.ok; speak(r.ok);
    if(game.tree){ const c=r.c.find(x=>x.k===r.a); document.querySelector(".tree").innerHTML=treeSvg(r.tips,[c.em,c.t],r.miss); }
    $("#next").style.display="block";
  } else { b.classList.remove("no"); void b.offsetWidth; b.classList.add("no"); fb.className="fb on bad"; fb.innerHTML=r.no; speak(r.no); }
}
$("#next").onclick=()=>{ R++; if(R<GAMES[G].rounds.length) load(); else { done[G]=true; $("#endtxt").textContent=GAMES[G].end; show("end"); speak("Super gemacht! "+GAMES[G].end); } };
$("#say").onclick=()=>speak($("#qtext").innerHTML);
$("#toHome").onclick=$("#endHome").onclick=()=>{ document.querySelectorAll(".st").forEach((e,i)=>e.textContent=done[i]?"★":""); show("home"); };
document.querySelectorAll("[data-game]").forEach(b=>b.onclick=()=>start(+b.dataset.game));
const modal=h=>{ $("#mbox").innerHTML=h+`<p style="text-align:center"><button class="next" style="display:inline-block" onclick="document.getElementById('modal').classList.remove('on')">OK</button></p>`; $("#modal").classList.add("on"); };

$("#cred").onclick=()=>modal(`<b>Bildnachweise</b> (Wikimedia Commons, verkleinert)<ul><li>Lucy: „120“, CC BY 2.5</li><li>Backenzahn (Denisova): Thilo Parg, CC BY-SA 3.0</li><li>Unterkiefer von Mauer: Gerbil, CC BY 3.0</li><li>Hobbit-Schädel (<i class="lat">Homo floresiensis</i>): Rama, CC BY-SA 3.0 FR</li><li>Neandertaler-Schädel: Luna04, CC BY-SA 3.0</li><li>Menschen-Schädel: Brockhaus’ Konversations-Lexikon (1892), gemeinfrei</li></ul>Tier-Bilder: Emoji-Zeichen des Geräts.`);
